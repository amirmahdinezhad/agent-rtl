name: Private development Beta
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: private-development-beta
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'amirmahdinezhad/rasta-beta' && github.event.repository.private == true
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:language
      - run: node --test --test-concurrency=1 'test/*.test.js'
      - run: npm run test:gui
      - run: ARTL_TEST_TARGET=t3 node test/gui-electron-smoke.mjs
      - name: Build, sign, publish and verify private panel update
        env:
          RELEASE_KEY_BASE64: ${{ secrets.ARTL_RELEASE_PRIVATE_KEY_BASE64 }}
        run: node tools/publish-development.mjs
